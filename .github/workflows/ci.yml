name: WasteWise Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run test suite
        working-directory: backend
        # PYTHONPATH so `app` resolves; pytest's rootdir insertion does not
        # cover the package when the tests are invoked from backend/.
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest tests -q

      - name: Verify the API imports cleanly
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -c "from app.main import app; print(len(app.routes), 'routes registered')"
